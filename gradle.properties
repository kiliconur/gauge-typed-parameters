# --- Plugin coordinates -------------------------------------------------------
pluginGroup = com.company.gauge
pluginVersion = 1.0.1-diagnostics

# --- Target IntelliJ Platform -------------------------------------------------
# The platform the plugin is compiled against AND targets at runtime.
#
# There is deliberately no "platformType" property any more. Since 2025.3 / build 253
# IntelliJ IDEA is published as ONE unified distribution, so the old Community artifact
# ("IC") does not exist for 2026.2.1 and resolving it fails with
#   Couldn't resolve IntellijIdeaCommunity download URL for version: '2026.2.1'
# build.gradle.kts therefore uses intellijIdea(platformVersion).
#
# Compiling against 2026.2 requires a JDK 25 Gradle JVM: the IntelliJ Platform 262
# artifacts are Java 25 bytecode (class file major 69), and JetBrains documents
# "2026.2 -> Java 25" at
#   https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# build.cmd locates a JDK 25 for the build only; it never touches the system JDK.
platformVersion = 2026.2.1

# false = take the IDE archive from the IntelliJ Maven repository (classic plugin-dev
# distribution). true = take the OS installer, which for the unified IDEA 2026.2.1 on
# Windows unpacks to a layout intellij-structure 3.330 (bundled with IPGP 2.18.1) cannot
# parse: it fails on lib\intellij.idea.ultimate.customization.jar and then reports
# "The 'Core' plugin (ID: 'com.intellij') was not found".
useInstaller = false

# --- Gauge plugin (required dependency) --------------------------------------
# Marketplace id: com.thoughtworks.gauge (plugin page 7535).
# 262.8665.176 declares compatibility with 262.8665 - 262.*, i.e. all of 2026.2.x.
gaugePluginId = com.thoughtworks.gauge
gaugePluginVersion = 262.8665.176

# --- Declared compatibility of the produced artifact --------------------------
pluginSinceBuild = 262
pluginUntilBuild =

# --- Bytecode level -----------------------------------------------------------
# The Java level IntelliJ Platform 2026.2 is built at.
javaVersion = 25

# --- Build ---------------------------------------------------------------------
# Toolchain matrix this project is pinned to:
#   Gradle 9.5.0   - runs on JDK 25 (Gradle >= 9.1.0 required for Java 25),
#                    and is the highest Gradle the Kotlin plugin 2.4.x supports
#   Kotlin 2.4.10  - supports Gradle 7.6.3 - 9.5.0 and jvmTarget 25
#   IPGP 2.18.1    - requires Gradle >= 9.0.0, Java runtime >= 17
# -Duser.language/-Duser.country are REQUIRED, not cosmetic.
# intellij-plugin-structure (bundled with IPGP) parses the IDE's plugin.xml with a
# locale-sensitive uppercase: ServiceType.valueOf(value.toUpperCase()). Under a Turkish
# default locale "application" uppercases to "APPLICATION" with a dotted capital I
# (U+0130), so the enum lookup throws:
#   No enum constant ...IdePluginContentDescriptor.ServiceType.APPLİCATİON
# That kills the IDE's core plugin descriptor and surfaces as the misleading
#   "The 'Core' plugin (ID: 'com.intellij') was not found"
# Forcing an invariant locale for the build JVM avoids it entirely.
org.gradle.jvmargs = -Xmx3g -XX:MaxMetaspaceSize=768m -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
