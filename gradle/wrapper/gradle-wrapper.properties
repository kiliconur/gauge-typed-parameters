distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.x is required by IntelliJ Platform Gradle Plugin 2.18.1 (min 9.0.0).
# 9.5.0 is chosen over the newest 9.7.x because it is the highest version the
# Kotlin Gradle plugin 2.4.x officially supports. Gradle 9.x runs on JVM 17-26,
# so the Java 17 build machine can run it unchanged.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
